# SPDX-License-Identifier: GPL-2.0-or-later
name: Godot build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      - run: dotnet restore src/SpaceTangent.Godot/SpaceTangent.Godot.csproj --locked-mode
      - run: dotnet build src/SpaceTangent.Godot/SpaceTangent.Godot.csproj --no-restore
      - uses: actions/cache@v4
        with:
          path: .ci/de440.440
          key: de440-29915576d0a6555766b99485ac3056ee415e86df4fce282611c31afb329ad062
      - name: Test and measure headless simulation with public DE440
        run: ./scripts/ci/godot-smoke.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-godot-coverage-${{ matrix.os }}
          path: .ci/godot-coverage
          if-no-files-found: warn
      - if: runner.os == 'Windows'
        run: dotnet restore src/SpaceTangent.Godot/SpaceTangent.Godot.csproj -p:Configuration=ExportRelease -r win-x64 --locked-mode
      - if: runner.os == 'Windows'
        run: dotnet build src/SpaceTangent.Godot/SpaceTangent.Godot.csproj -c ExportRelease -r win-x64 --no-restore
      - run: dotnet restore tools/SpaceTangent.ModelTool/SpaceTangent.ModelTool.csproj --locked-mode
      - run: dotnet build tools/SpaceTangent.ModelTool/SpaceTangent.ModelTool.csproj --no-restore -c Release
